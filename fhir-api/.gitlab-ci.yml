include:
  - local: ci/step1.gitlab-ci.yml
    rules:
      - if: '$STEP1_CI_ENABLED == "true"'

stages:
  - test
  - build
  - deploy

test:
  image: node:22-bookworm-slim
  stage: test
  script:
    - npm ci --no-audit --no-fund
    - npm run check
    - npm audit --omit=dev --audit-level=high

# Uses a disposable MongoDB service and the same HTTP checks as local Docker.
integration:
  image: node:22-bookworm-slim
  stage: test
  services:
    - name: mongo:7.0.14
      alias: mongo
  variables:
    MONGO_HOSTNAME: mongo
    MONGO_DB_NAME: fhir_test
    MONGO_USERNAME: ""
    MONGO_PASSWORD: ""
    SERVER_PORT: "3000"
    FHIR_AUTH_ENABLED: "false"
    FHIR_LEGACY_ENDPOINTS_ENABLED: "false"
    KAFKA_ENABLED: "false"
    MONITORING_INGESTION_MODE: synthetic
    MONITORING_KAFKA_PUBLISHING_ENABLED: "false"
    MONITORING_SYNTHETIC_AUTH_REQUIRED: "false"
    LOGGING_LEVEL: error
    FHIR_TEST_BASE_URL: http://127.0.0.1:3000
  script:
    - npm ci --no-audit --no-fund
    - |
      node src/index.js > /tmp/fhir-test-server.log 2>&1 &
      api_pid=$!
      trap 'kill "$api_pid" 2>/dev/null || true' EXIT
      if ! npm run test:integration; then
        cat /tmp/fhir-test-server.log
        exit 1
      fi

runtime-audit:
  image: node:22-bookworm-slim
  stage: test
  script:
    - mkdir -p .step1-lock-check
    - cp package.step1.json .step1-lock-check/package.json
    - cp package-lock.step1.json .step1-lock-check/package-lock.json
    - cd .step1-lock-check
    - npm audit --omit=dev --audit-level=high
